skip_clone: true

matrix:
  include:
    - PHP_MAJOR_VERSION: 8.5
      PHP_VERSION: 8.5.5

# Runs the PHP-CS-Fixer check for the addons for PRs and pushes to non-stable branches.
when:
  branch:
    exclude: [ stable ]
  event: [ pull_request, push ]

# This forces the checks to the "opensocial" labeled location (because of access issues with git.friendi.ca)
labels:
  location: opensocial

steps:
  clone_friendica_base:
    image: alpine/git
    commands:
      - git config --global --add safe.directory $CI_WORKSPACE
      - git clone https://github.com/friendica/friendica.git .
      - git checkout develop

  clone_friendica_addon:
    image: alpine/git
    commands:
      - git clone $CI_REPO_CLONE_URL addon
      - cd addon/
      - git checkout $CI_COMMIT_BRANCH

  restore_cache:
    image: meltwater/drone-cache:dev
    settings:
      backend: "filesystem"
      restore: true
      cache_key: '{{ .Repo.Name }}_phpcs_{{ arch }}_{{ os }}'
      archive_format: "gzip"
      mount:
        - '.composer'
    volumes:
      - /tmp/drone-cache:/tmp/cache

  composer_install:
    image: friendicaci/php${PHP_MAJOR_VERSION}:php${PHP_VERSION}
    commands:
      - export COMPOSER_HOME=.composer
      - ./bin/composer.phar validate
      - ./bin/composer.phar install --prefer-dist

  rebuild_cache:
    image: meltwater/drone-cache:dev
    settings:
      backend: "filesystem"
      rebuild: true
      cache_key: '{{ .Repo.Name }}_phpcs_{{ arch }}_{{ os }}'
      archive_format: "gzip"
      mount:
        - '.composer'
    volumes:
      - /tmp/drone-cache:/tmp/cache

  check:
    image: friendicaci/php${PHP_MAJOR_VERSION}:php${PHP_VERSION}
    commands:
      - bin/composer.phar run addons:cs:check
