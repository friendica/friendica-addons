# Runs the static addon QA (PHPStan, Rector, PHP-CS-Fixer) against the current
# Friendica develop. Because the canonical addon PRs/merges happen on
# git.friendi.ca and CI only runs on this GitHub mirror, this workflow acts
# as a post-merge gate: every sync of develop/stable to the mirror is checked.

name: Addon Code Quality

on:
  push:
    branches:
      - develop
      - stable
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: PHPStan / Rector / PHP-CS-Fixer (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']

    steps:
      - name: Checkout addons
        uses: actions/checkout@v4
        with:
          path: addon

      - name: Clone Friendica core
        run: |
          git init -q .
          git remote add origin https://github.com/friendica/friendica.git
          git fetch --depth 1 origin develop
          git checkout -b develop FETCH_HEAD

      - name: Setup PHP with composer and extensions
        uses: shivammathur/setup-php@v2 #https://github.com/shivammathur/setup-php
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          tools: none

      - name: Install Composer dependencies
        uses: "ramsey/composer-install@v4"

      - name: Run PHPStan
        run: composer run addons:phpstan

      - name: Run Rector
        run: composer run addons:rector:check

      - name: Run PHP-CS-Fixer
        run: composer run addons:cs:check
