# Runs the addon tests against the current Friendica develop. Because the
# canonical addon PRs/merges happen on git.friendi.ca and CI only runs on this
# GitHub mirror, this workflow acts as a post-merge gate: every sync of
# develop/stable to the mirror is checked.

name: Addon Tests

on:
  push:
    branches:
      - develop
      - stable
  pull_request:
  workflow_dispatch:

jobs:
  db-tests:
    name: Addon tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:latest
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: test
          MYSQL_PASSWORD: test
          MYSQL_USER: test
        ports:
          - 3306/tcp
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis
        ports:
          - 6379/tcp
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

      memcached:
        image: memcached
        ports:
          - 11211/tcp

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout addons
        uses: actions/checkout@v4
        with:
          path: addon

      - name: Clone Friendica core
        run: |
          git init -q .
          git remote add origin https://github.com/friendica/friendica.git
          git fetch --depth 1 origin develop
          git checkout -b develop FETCH_HEAD

      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2 #https://github.com/shivammathur/setup-php
        with:
          php-version: ${{ matrix.php }}
          tools: pecl, composer
          extensions: pdo_mysql, gd, zip, opcache, ctype, pcntl, ldap, apcu, memcached, redis, imagick, memcache
          coverage: xdebug
          ini-values: apc.enabled=1, apc.enable_cli=1

      - name: Install Composer dependencies
        uses: "ramsey/composer-install@v4"

      - name: Start mysql service
        run: sudo /etc/init.d/mysql start

      - name: Copy default Friendica config
        run: cp config/local-sample.config.php config/local.config.php

      - name: Verify MariaDB connection
        env:
          PORT: ${{ job.services.mariadb.ports[3306] }}
        run: |
          while ! mysqladmin ping -h"127.0.0.1" -P"$PORT" --silent; do
            sleep 1
          done

      - name: Setup MYSQL database
        env:
          PORT: ${{ job.services.mariadb.ports[3306] }}
        run: |
          mysql -h"127.0.0.1" -P"$PORT" -utest -ptest test < database.sql

      - name: Test addons with phpunit
        run: composer run addons:test
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: ${{ job.services.mariadb.ports[3306] }}
          MYSQL_DATABASE: test
          MYSQL_PASSWORD: test
          MYSQL_USER: test
          REDIS_PORT: ${{ job.services.redis.ports[6379] }}
          REDIS_HOST: 127.0.0.1
          MEMCACHED_PORT: ${{ job.services.memcached.ports[11211] }}
          MEMCACHE_PORT: ${{ job.services.memcached.ports[11211] }}
